name: faseeh_app
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.8
  lottie: ^3.6.1
  flutter_svg: ^2.3.0
  easy_localization: ^3.0.8
  animations: ^3.0.0
  flutter_screenutil: ^5.9.3
  go_router: ^18.0.1
  animate_do: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/lotties/
    - assets/images/
    - assets/translations/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/static/Cairo-Regular.ttf
